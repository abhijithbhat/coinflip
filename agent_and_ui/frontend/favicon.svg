<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <rect x="3" y="3" width="58" height="58" rx="11" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Outer telemetry coin ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="3 2.5"/>
  <!-- Inner Bernoulli arc -->
  <path d="M 32 13 A 19 19 0 0 1 51 32" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
  <!-- CF Monogram -->
